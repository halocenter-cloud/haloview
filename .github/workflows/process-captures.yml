# Desactivado: el ranking web se alimenta desde HaloBackend (data.js),
# no desde OCR de capturas. Mantener este workflow apagado evita que
# sobrescriba el ranking real.
#
# Para reactivar solo como archivo de matches (sin tocar data.js),
# quita el `if: false` del job y usa workflow_dispatch.
name: Process Halo captures

on:
  workflow_dispatch: {}

jobs:
  build:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Process captures (matches.json only)
        run: python scripts/process_capture.py

      - name: Commit and push matches.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git diff --quiet --cached || (git commit -m "Automated match archive update" && git push)
